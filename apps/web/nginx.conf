# NV Core web (SPA) — Nginx config.
# Serves the static Vite build and rewrites unknown paths to index.html so
# client-side routing (react-router) works on deep links / refresh.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ── Security headers (RC hardening) ────────────────────────────────────────
  # HSTS is safe behind TLS; harmless on plain HTTP during local testing.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-XSS-Protection "0" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # CSP: self by default; Google Fonts; images from Cloudinary/data; API + WS
  # over https/wss (host is deployment-specific, hence the scheme allowances).
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: https:; media-src 'self' https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self' https: wss:" always;

  # Long-cache hashed build assets.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback: every other route serves index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Small gzip win for text assets.
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
