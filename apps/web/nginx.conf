# NV Core web (SPA) — Nginx config.
# Serves the static Vite build and rewrites unknown paths to index.html so
# client-side routing (react-router) works on deep links / refresh.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Long-cache hashed build assets.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback: every other route serves index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Small gzip win for text assets.
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
