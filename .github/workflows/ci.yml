name: CI

# Runs on every push to the main and development branches, on every PR, and on
# demand. The fast `quality` gate (typecheck · lint · build · unit + coverage)
# runs everywhere so a bad commit is caught the moment it lands on your branch.
# The heavier `e2e` job (Postgres + Playwright) runs on PRs and on main, where a
# clean database service is available.
on:
  push:
    branches:
      - main
      - master
      - "claude/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Match the local toolchain (see package.json engines / packageManager).
  NODE_VERSION: "22"
  PNPM_VERSION: "10"

jobs:
  quality:
    name: Typecheck · Lint · Build · Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # @nv/domain is the contracts package every app compiles against — build it
      # first so typecheck/lint/build see fresh declarations.
      - name: Build domain (contracts)
        run: pnpm --filter @nv/domain build
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Build (api + web)
        run: pnpm build
      - name: Unit tests + coverage (api)
        run: pnpm --filter @nv/api test:coverage
      - name: Unit tests + coverage gate (web)
        run: pnpm --filter @nv/web test:coverage

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Keep feature-branch pushes fast: E2E runs on PRs, on main, and on demand.
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/master'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nvcore
          POSTGRES_PASSWORD: nvcore
          POSTGRES_DB: nvcore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nvcore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nvcore:nvcore@localhost:5432/nvcore?schema=public
      JWT_SECRET: ci-secret-at-least-16-characters-long
      CORS_ORIGINS: http://localhost:3000
      VITE_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build domain (contracts)
        run: pnpm --filter @nv/domain build
      - name: Prisma generate + migrate
        run: |
          pnpm --filter @nv/api prisma:generate
          pnpm --filter @nv/api exec prisma migrate deploy
      - name: Build api + web
        run: |
          pnpm --filter @nv/api build
          pnpm --filter @nv/web build
      - name: Install Playwright browser
        run: pnpm --filter @nv/web exec playwright install --with-deps chromium
      - name: Start servers + run E2E
        run: |
          node apps/api/dist/main.js &
          API_PID=$!
          pnpm --filter @nv/web exec vite preview --port 3000 --host &
          WEB_PID=$!
          npx -y wait-on http://localhost:4000/api/health http://localhost:3000/login --timeout 90000
          pnpm --filter @nv/web test:e2e
          kill $API_PID $WEB_PID || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
