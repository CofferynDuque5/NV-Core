<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0B0D10" />
<meta name="robots" content="noindex" />
<title>Página no encontrada · NV Marketing</title>
<link rel="icon" href="/favicon.ico" sizes="32x32" />
<link rel="stylesheet" href="/fonts/fonts.css" />
<style>
  :root{--bg:#0B0D10;--panel:#151A21;--line:rgba(255,255,255,.1);--text:#F4F6FA;--muted:#A3ACBA;
    --grad:linear-gradient(135deg,#5F86F2 0%,#8C7BEF 100%);--btn-grad:linear-gradient(135deg,#3F63D6 0%,#6650D4 100%)}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(900px 500px at 50% -10%,rgba(95,134,242,.18),transparent 60%),var(--bg);color:var(--text);font:16px/1.6 Inter,system-ui,sans-serif;text-align:center}
  main{max-width:520px}
  .logo{display:inline-flex;align-items:center;gap:10px;font:700 18px Inter,system-ui,sans-serif;color:var(--text);text-decoration:none;margin-bottom:36px}
  .logo svg{width:36px;height:36px}
  .code{font:600 clamp(72px,18vw,128px)/1 Newsreader,Georgia,serif;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin:0}
  h1{font:600 clamp(26px,5vw,34px)/1.2 Newsreader,Georgia,serif;margin:12px 0 10px}
  p{color:var(--muted);margin:0 0 28px}
  .acts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 22px;border-radius:12px;font-weight:600;text-decoration:none}
  .btn-primary{background:var(--btn-grad);color:#fff}
  .btn-ghost{border:1px solid var(--line);color:var(--text);background:rgba(255,255,255,.04)}
  .btn:focus-visible{outline:2px solid #8FA8F5;outline-offset:3px}
</style>
</head>
<body>
<main>
  <a class="logo" href="/" aria-label="NV Marketing, inicio">
    <svg viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse"><stop stop-color="#5F86F2"/><stop offset="1" stop-color="#8C7BEF"/></linearGradient></defs><rect width="40" height="40" rx="11" fill="url(#lg)"/><g transform="translate(6 6) scale(.4375)" fill="none" stroke-width="5"><path d="M8 26h9l17-11v34L17 38H8z" stroke="#fff" stroke-linejoin="round"/><path d="M17 38v11h9v-7" stroke="#fff" stroke-linejoin="round"/><path d="M43 24a11 11 0 0 1 0 16" stroke="#fff" stroke-linecap="round"/><path d="M50 16a21 21 0 0 1 0 32" stroke="rgba(255,255,255,.55)" stroke-linecap="round"/></g></svg>
    NV Marketing
  </a>
  <p class="code" aria-hidden="true">404</p>
  <h1>Esta página no existe</h1>
  <p>Puede que el enlace esté mal escrito o que la página se haya movido. Desde el inicio llegas a todo.</p>
  <div class="acts">
    <a class="btn btn-primary" href="/">Ir al inicio</a>
    <a class="btn btn-ghost" href="/#precios">Ver precios</a>
  </div>
</main>
</body>
</html>
