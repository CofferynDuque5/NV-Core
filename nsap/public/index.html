<!doctype html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NSAP — Automatización de WhatsApp</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link href="/css/styles.css" rel="stylesheet" />
  </head>
  <body class="bg-body">
    <nav class="navbar navbar-expand bg-body-tertiary border-bottom">
      <div class="container-fluid">
        <span class="navbar-brand fw-bold"><i class="bi bi-whatsapp text-success"></i> NSAP</span>
        <ul class="nav nav-pills ms-auto" id="tabs">
          <li class="nav-item"><button class="nav-link active" data-tab="conexion">Conexión</button></li>
          <li class="nav-item"><button class="nav-link" data-tab="grupos">Grupos</button></li>
          <li class="nav-item"><button class="nav-link" data-tab="campanas">Campañas</button></li>
        </ul>
      </div>
    </nav>

    <main class="container py-4">
      <!-- ── Conexión ─────────────────────────────────────────────── -->
      <section data-panel="conexion">
        <div class="row g-4">
          <div class="col-lg-7">
            <div class="card">
              <div class="card-header d-flex align-items-center justify-content-between">
                <span><i class="bi bi-whatsapp text-success"></i> WhatsApp</span>
                <span id="wa-badge" class="badge text-bg-secondary">—</span>
              </div>
              <div class="card-body">
                <dl class="row mb-3 small">
                  <dt class="col-5 text-secondary">Proveedor</dt><dd class="col-7">Baileys</dd>
                  <dt class="col-5 text-secondary">Número</dt><dd class="col-7" id="wa-number">—</dd>
                  <dt class="col-5 text-secondary">Última conexión</dt><dd class="col-7" id="wa-last">—</dd>
                  <dt class="col-5 text-secondary">Grupos sincronizados</dt><dd class="col-7" id="wa-groups">0</dd>
                  <dt class="col-5 text-secondary">Contactos</dt><dd class="col-7" id="wa-contacts">0</dd>
                </dl>
                <div class="d-flex flex-wrap gap-2">
                  <button id="btn-connect" class="btn btn-success btn-sm"><i class="bi bi-plug"></i> Conectar</button>
                  <button id="btn-sync" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-repeat"></i> Sincronizar</button>
                  <button id="btn-reconnect" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-clockwise"></i> Reconectar</button>
                  <button id="btn-disconnect" class="btn btn-outline-danger btn-sm"><i class="bi bi-x-circle"></i> Desconectar</button>
                </div>
              </div>
            </div>
          </div>
          <div class="col-lg-5">
            <div class="card h-100">
              <div class="card-header">Vinculación</div>
              <div class="card-body d-flex flex-column align-items-center justify-content-center text-center" id="qr-area">
                <div class="text-secondary"><i class="bi bi-qr-code fs-1"></i><p class="mt-2 mb-0 small">Pulsa «Conectar» para generar el QR</p></div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- ── Grupos ──────────────────────────────────────────────── -->
      <section data-panel="grupos" hidden>
        <div class="d-flex align-items-center justify-content-between mb-3">
          <h5 class="mb-0">Grupos</h5>
          <button id="btn-sync-groups" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-repeat"></i> Sincronizar</button>
        </div>
        <div class="card"><div class="card-body p-0">
          <table class="table table-hover mb-0 align-middle">
            <thead><tr><th>Grupo</th><th class="text-end">Miembros</th><th>ID</th></tr></thead>
            <tbody id="groups-body"><tr><td colspan="3" class="text-secondary text-center py-4">Sin grupos. Conecta y sincroniza.</td></tr></tbody>
          </table>
        </div></div>
      </section>

      <!-- ── Campañas ────────────────────────────────────────────── -->
      <section data-panel="campanas" hidden>
        <div class="row g-4">
          <div class="col-lg-5">
            <div class="card">
              <div class="card-header">Nueva campaña</div>
              <div class="card-body">
                <form id="campaign-form" class="vstack gap-3">
                  <div>
                    <label class="form-label small">Nombre</label>
                    <input class="form-control form-control-sm" name="name" required placeholder="Promo de la semana" />
                  </div>
                  <div>
                    <label class="form-label small">Mensaje</label>
                    <textarea class="form-control form-control-sm" name="message" rows="4" required placeholder="Escribe el mensaje…"></textarea>
                  </div>
                  <div>
                    <label class="form-label small d-flex justify-content-between">
                      <span>Grupos objetivo</span>
                      <a href="#" id="pick-all" class="small">Todos</a>
                    </label>
                    <div id="group-picker" class="border rounded p-2 overflow-auto" style="max-height: 180px">
                      <div class="text-secondary small">Sincroniza grupos primero.</div>
                    </div>
                  </div>
                  <div>
                    <label class="form-label small">Programación</label>
                    <div class="btn-group btn-group-sm w-100 mb-2" role="group">
                      <input type="radio" class="btn-check" name="schedType" id="sched-once" value="once" checked />
                      <label class="btn btn-outline-light" for="sched-once">Una vez</label>
                      <input type="radio" class="btn-check" name="schedType" id="sched-daily" value="daily" />
                      <label class="btn btn-outline-light" for="sched-daily">Diaria</label>
                    </div>
                    <input type="datetime-local" class="form-control form-control-sm" name="onceAt" id="once-at" />
                    <input type="time" class="form-control form-control-sm d-none" name="dailyAt" id="daily-at" value="08:00" />
                  </div>
                  <button class="btn btn-success btn-sm" type="submit">Crear campaña</button>
                  <div id="campaign-error" class="text-danger small"></div>
                </form>
              </div>
            </div>
          </div>
          <div class="col-lg-7">
            <h5 class="mb-3">Campañas</h5>
            <div id="campaigns-list" class="vstack gap-2">
              <div class="text-secondary small">Aún no hay campañas.</div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>
    <script src="/js/app.js" type="module"></script>
  </body>
</html>
